name: MRI Workbench Build

on:
  pull_request:
    paths:
      - "api.py"
      - "data_loader.py"
      - "feature_extractor.py"
      - "models.py"
      - "frontend/**"
      - "requirements*.txt"
      - ".github/workflows/mri-workbench-build.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-react-api.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-react-api.txt
      - run: python -m compileall -q api.py data_loader.py feature_extractor.py models.py
      - run: python -c "from api import app; print(app.title)"

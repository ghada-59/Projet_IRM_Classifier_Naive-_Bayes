name: Structural morphometrics tests

on:
  push:
    paths:
      - "experiments/structural_morphometrics/**"
      - ".github/workflows/structural-morphometrics-tests.yml"
  pull_request:
    paths:
      - "experiments/structural_morphometrics/**"
      - ".github/workflows/structural-morphometrics-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/structural_morphometrics
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/structural_morphometrics/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
